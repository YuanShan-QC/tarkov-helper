<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔科夫助手 · 价格 / 任务 / 藏身处</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2e3440;
    --text: #e6e8ec;
    --text-dim: #9aa0aa;
    --accent: #c8a24a;
    --green: #4caf50;
    --red: #e05252;
    --user-bubble: #2d5c8a;
    --assistant-bubble: #262b35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 980px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  /* ===== 顶部 ===== */
  .header {
    padding: 14px 22px 0;
    border-bottom: 1px solid var(--border);
  }
  .header .title-row { display: flex; align-items: center; gap: 10px; }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 8px #4caf50; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tabs { display: flex; gap: 4px; margin-top: 12px; }
  .tabs .tab {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s;
  }
  .tabs .tab:hover { color: var(--text); }
  .tabs .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  /* ===== 主体 ===== */
  main { flex: 1; overflow: hidden; position: relative; }
  .tab-panel { display: none; height: 100%; flex-direction: column; }
  .tab-panel.active { display: flex; }
  /* ===== 搜索栏 ===== */
  .search-bar { display: flex; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .search-bar input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar button {
    background: var(--accent); color: #1a1d24; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .search-bar button:hover { filter: brightness(1.1); }
  /* ===== 双栏布局（列表 + 详情） ===== */
  .split { flex: 1; display: flex; overflow: hidden; }
  .col-list { width: 300px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); }
  .col-detail { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .list-item {
    padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .list-item:hover { background: var(--panel-2); }
  .list-item.active { background: var(--panel-2); border-left: 3px solid var(--accent); }
  .list-item .name { font-size: 14px; }
  .list-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .empty-tip { padding: 24px; text-align: center; color: var(--text-dim); font-size: 13px; }
  /* ===== 详情卡片 ===== */
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 16px; margin-bottom: 10px; color: var(--accent); }
  .card .kv { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
  .card .kv span b { color: var(--text); font-weight: 600; }
  .card .kv span { color: var(--text-dim); }
  .up { color: var(--red); font-weight: 600; }
  .down { color: var(--green); font-weight: 600; }
  .flat { color: var(--text-dim); }
  /* ===== 目标/材料列表 ===== */
  .obj { padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 13px; line-height: 1.6; }
  .obj:last-child { border-bottom: none; }
  .obj .tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px;
    background: #2d3a4a; color: #7fb3e0; margin-right: 6px; vertical-align: 1px;
  }
  .req-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .req {
    font-size: 12px; background: #2d3a4a; color: #d6c08a; padding: 3px 9px;
    border-radius: 5px; white-space: nowrap;
  }
  /* ===== 藏身处子 tab ===== */
  .sub-tabs { display: flex; gap: 4px; padding: 12px 18px 0; border-bottom: 1px solid var(--border); }
  .sub-tabs button {
    background: transparent; color: var(--text-dim); border: none; padding: 8px 14px;
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .sub-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .content-scroll { flex: 1; overflow-y: auto; padding: 14px 18px; }
  /* ===== 聊天栏 ===== */
  .messages { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 12px 16px; border-radius: 14px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border-bottom-left-radius: 4px; }
  .msg .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .trace { margin-top: 8px; font-size: 12px; color: var(--text-dim); width: 100%; }
  .trace summary { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .trace .step { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .trace .step .tool { color: #7fb3e0; font-weight: 600; font-family: monospace; font-size: 12px; }
  .trace .step .obs { margin-top: 4px; white-space: pre-wrap; font-size: 12px; color: var(--text-dim); }
  .input-area { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-area input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; color: var(--text); font-size: 14px; outline: none;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area button {
    background: var(--accent); color: #1a1d24; border: none; border-radius: 10px;
    padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { text-align: center; color: var(--text-dim); font-size: 12px; padding: 10px; }
  .chart-box { height: 260px; margin-top: 6px; }
  .seg { display: inline-flex; gap: 4px; margin-bottom: 8px; }
  .seg button {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .seg button.active { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-row">
      <div class="dot"></div>
      <div>
        <h1>塔科夫助手</h1>
        <div class="sub">价格行情 · 任务查询 · 藏身处配方 · 智能问答</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="price" onclick="switchTab('price')">价格行情</button>
      <button class="tab" data-tab="task" onclick="switchTab('task')">任务查询</button>
      <button class="tab" data-tab="hideout" onclick="switchTab('hideout')">藏身处配方</button>
      <button class="tab" data-tab="chat" onclick="switchTab('chat')">智能助手</button>
    </div>
  </div>

  <main>
    <!-- ===== 价格行情 ===== -->
    <section class="tab-panel active" id="panel-price">
      <div class="search-bar">
        <input id="price-search" placeholder="搜索物品，如：显卡、LEDX、比特币、金链" autocomplete="off">
        <button onclick="searchItems()">搜索</button>
      </div>
      <div class="split">
        <div class="col-list" id="price-list"><div class="empty-tip">输入关键词搜索物品</div></div>
        <div class="col-detail" id="price-detail"><div class="empty-tip">点击左侧物品查看价格与趋势</div></div>
      </div>
    </section>

    <!-- ===== 任务查询 ===== -->
    <section class="tab-panel" id="panel-task">
      <div class="search-bar">
        <input id="task-search" placeholder="搜索任务，如：私人诊所、制裁、挖矿" autocomplete="off">
        <button onclick="searchTasks()">搜索</button>
      </div>
      <div class="split">
        <div class="col-list" id="task-list"><div class="empty-tip">输入关键词搜索任务，或点「搜索」查看全部</div></div>
        <div class="col-detail" id="task-detail"><div class="empty-tip">点击左侧任务查看任务内容</div></div>
      </div>
    </section>

    <!-- ===== 藏身处配方 ===== -->
    <section class="tab-panel" id="panel-hideout">
      <div class="sub-tabs">
        <button class="active" data-sub="crafts" onclick="switchSubTab('crafts')">制造配方</button>
        <button data-sub="barters" onclick="switchSubTab('barters')">以物换物</button>
        <button data-sub="stations" onclick="switchSubTab('stations')">工作站升级</button>
      </div>
      <div class="content-scroll" id="hideout-content"><div class="empty-tip">加载中…</div></div>
    </section>

    <!-- ===== 智能助手 ===== -->
    <section class="tab-panel" id="panel-chat">
      <div class="messages" id="messages">
        <div class="msg assistant">
          <div class="label">助手</div>
          <div class="bubble">你好！我是智能问答助手，适合查价格走势、比价、任务需求这类复杂问题。<br><br>试试问我：<br>· 显卡最近 30 天走势<br>· 哪些任务需要 LEDX<br>· 捡了个金链，卖商人还是挂跳蚤</div>
        </div>
      </div>
      <div class="input-area">
        <input id="chat-input" placeholder="问点什么，比如：显卡卖给谁划算" autocomplete="off">
        <button id="send" onclick="sendMessage()">发送</button>
      </div>
      <div class="hint">按 Enter 发送 · 点击「查看思考过程」可看 Agent 的工具调用轨迹</div>
    </section>
  </main>
</div>

<script>
/* ================= Tab 切换 ================= */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'hideout' && !hideoutLoaded) loadHideout();
}

/* ================= 工具函数 ================= */
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtPrice(v) {
  if (v == null) return '—';
  const n = Number(v);
  if (n >= 10000) return (n / 10000).toFixed(1) + ' 万';
  return n.toLocaleString();
}
async function getJSON(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

/* ================= 价格行情 ================= */
async function searchItems() {
  const kw = document.getElementById('price-search').value.trim();
  const list = document.getElementById('price-list');
  if (!kw) { list.innerHTML = '<div class="empty-tip">输入关键词搜索物品</div>'; return; }
  list.innerHTML = '<div class="empty-tip">搜索中…</div>';
  try {
    const data = await getJSON('/api/search?keyword=' + encodeURIComponent(kw) + '&limit=20');
    if (!data.items || data.items.length === 0) {
      list.innerHTML = '<div class="empty-tip">没找到相关物品，换个关键词试试</div>';
      return;
    }
    list.innerHTML = data.items.map(it =>
      '<div class="list-item" onclick="showItem(\'' + it.id + '\')">' +
      '<div class="name">' + escapeHtml(it.name) + '</div>' +
      '<div class="meta">' + escapeHtml(it.normalizedName) + '</div></div>'
    ).join('');
    // 自动选中第一个
    showItem(data.items[0].id);
  } catch (e) {
    list.innerHTML = '<div class="empty-tip">搜索失败：' + escapeHtml(e.message) + '</div>';
  }
}

let currentItemId = null;
let currentDays = 30;

async function showItem(id) {
  currentItemId = id;
  document.querySelectorAll('#price-list .list-item').forEach(el =>
    el.classList.toggle('active', el.onclick && el.getAttribute('onclick').includes(id)));
  const detail = document.getElementById('price-detail');
  detail.innerHTML = '<div class="empty-tip">加载中…</div>';
  try {
    const data = await getJSON('/api/item/' + id);
    if (data.error) { detail.innerHTML = '<div class="empty-tip">' + escapeHtml(data.error) + '</div>'; return; }
    const p = data.price || {};
    const pct = p.changeLast48hPercent;
    const pctCls = pct == null ? 'flat' : (pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat'));
    const pctTxt = pct == null ? '—' : (pct > 0 ? '+' : '') + pct + '%';
    detail.innerHTML =
      '<div class="card"><h3>' + escapeHtml(data.name) + '</h3>' +
      '<div class="kv">' +
      '<span>英文名 <b>' + escapeHtml(data.normalizedName) + '</b></span>' +
      '<span>类型 <b>' + escapeHtml(data.type) + '</b></span>' +
      '<span>占格 <b>' + data.width + 'x' + data.height + '</b></span>' +
      '<span>重量 <b>' + data.weight + ' kg</b></span>' +
      '<span>基础价 <b>' + fmtPrice(data.basePrice) + ' 卢布</b></span>' +
      (data.minLevelForFlea != null ? '<span>跳蚤最低等级 <b>' + data.minLevelForFlea + '</b></span>' : '') +
      '</div></div>' +
      '<div class="card"><h3>市场价格</h3><div class="kv">' +
      (p.noFlea
        ? '<span>该物品<b>禁止跳蚤交易</b></span>'
        : '<span>24h均价 <b>' + fmtPrice(p.avg24hPrice) + ' 卢布</b></span>' +
          '<span>24h最低/最高 <b>' + fmtPrice(p.low24hPrice) + ' / ' + fmtPrice(p.high24hPrice) + '</b></span>' +
          '<span>最近最低价 <b>' + fmtPrice(p.lastLowPrice) + '</b></span>' +
          '<span>48h涨跌 <b class="' + pctCls + '">' + pctTxt + '</b></span>') +
      '</div></div>' +
      '<div class="card"><h3>价格趋势</h3>' +
      '<div class="seg">' +
      '<button class="' + (currentDays === 7 ? 'active' : '') + '" onclick="setDays(7)">7天</button>' +
      '<button class="' + (currentDays === 30 ? 'active' : '') + '" onclick="setDays(30)">30天</button>' +
      '</div><div class="chart-box" id="trend-chart"></div></div>';
    loadTrend(id, data.name, currentDays);
  } catch (e) {
    detail.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

function setDays(d) { currentDays = d; if (currentItemId) showItem(currentItemId); }

async function loadTrend(id, name, days) {
  try {
    const data = await getJSON('/api/price/trend/' + id + '?days=' + days);
    if (!data.points || data.points.length < 2) {
      document.getElementById('trend-chart').innerHTML = '<div class="empty-tip">暂无足够价格数据</div>';
      return;
    }
    const el = document.getElementById('trend-chart');
    const chart = echarts.init(el);
    const labels = data.points.map(p => { const d = new Date(p.ts); return (d.getMonth() + 1) + '/' + d.getDate(); });
    const values = data.points.map(p => Math.round(p.price));
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 60, right: 16, top: 16, bottom: 28 },
      tooltip: { trigger: 'axis', valueFormatter: v => v + ' 卢布' },
      xAxis: { type: 'category', data: labels, axisLabel: { color: '#9aa0aa' }, axisLine: { lineStyle: { color: '#2e3440' } } },
      yAxis: { type: 'value', name: '卢布', nameTextStyle: { color: '#9aa0aa' }, axisLabel: { color: '#9aa0aa', formatter: v => (v >= 10000 ? (v / 10000) + '万' : v) }, splitLine: { lineStyle: { color: '#2e3440' } } },
      series: [{ type: 'line', data: values, smooth: true, showSymbol: false, lineStyle: { color: '#c8a24a', width: 2 }, areaStyle: { color: 'rgba(200,162,74,0.15)' } }]
    });
    window.addEventListener('resize', () => chart.resize());
  } catch (e) {
    document.getElementById('trend-chart').innerHTML = '<div class="empty-tip">趋势加载失败</div>';
  }
}

/* ================= 任务查询 ================= */
async function searchTasks() {
  const kw = document.getElementById('task-search').value.trim();
  const list = document.getElementById('task-list');
  list.innerHTML = '<div class="empty-tip">加载中…</div>';
  try {
    const data = await getJSON('/api/tasks?keyword=' + encodeURIComponent(kw) + '&limit=200');
    if (!data.tasks || data.tasks.length === 0) {
      list.innerHTML = '<div class="empty-tip">没找到相关任务</div>';
      return;
    }
    list.innerHTML = data.tasks.map(t =>
      '<div class="list-item" onclick="showTask(\'' + t.id + '\')">' +
      '<div class="name">' + escapeHtml(t.name) + '</div>' +
      '<div class="meta">' + escapeHtml(t.normalizedName) + '</div></div>'
    ).join('');
  } catch (e) {
    list.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

const OBJ_TAG = {
  giveItem: '上交物品', findItem: '寻找物品', plantItem: '放置物品',
  findQuestItem: '寻找任务物品', giveQuestItem: '上交任务物品', useItem: '使用物品',
  sellItem: '出售物品', buildWeapon: '改装武器', visit: '访问地点', shoot: '击杀目标',
  extract: '撤离', mark: '标记地点', traderLevel: '商人等级', skill: '技能',
  experience: '经验', taskStatus: '任务状态',
};

async function showTask(id) {
  document.querySelectorAll('#task-list .list-item').forEach(el =>
    el.classList.toggle('active', el.getAttribute('onclick').includes(id)));
  const detail = document.getElementById('task-detail');
  detail.innerHTML = '<div class="empty-tip">加载中…</div>';
  try {
    const d = await getJSON('/api/tasks/' + id);
    if (d.error) { detail.innerHTML = '<div class="empty-tip">' + escapeHtml(d.error) + '</div>'; return; }
    let html = '<div class="card"><h3>' + escapeHtml(d.name) + '</h3>' +
      '<div class="kv">' +
      '<span>商人 <b>' + escapeHtml(d.trader) + '</b></span>' +
      (d.minPlayerLevel != null ? '<span>需求等级 <b>' + d.minPlayerLevel + '</b></span>' : '') +
      '</div></div>';
    html += '<div class="card"><h3>任务目标</h3>';
    if (!d.objectives || d.objectives.length === 0) {
      html += '<div class="empty-tip">无目标信息</div>';
    } else {
      d.objectives.forEach(o => {
        const tag = OBJ_TAG[o.type] || o.type;
        let line = '<div class="obj"><span class="tag">' + tag + '</span>' + escapeHtml(o.desc || '');
        if (o.count > 1) line += ' ×' + o.count;
        line += '</div>';
        if (o.items && o.items.length > 0) {
          line += '<div class="req-list">' + o.items.map(i => '<span class="req">' + escapeHtml(i) + '</span>').join('') + '</div>';
        }
        html += line;
      });
    }
    html += '</div>';
    if (d.reward_items && d.reward_items.length > 0) {
      html += '<div class="card"><h3>完成奖励</h3><div class="req-list">' +
        d.reward_items.map(r => '<span class="req">' + escapeHtml(r.name) + ' ×' + r.count + '</span>').join('') +
        '</div></div>';
    }
    detail.innerHTML = html;
  } catch (e) {
    detail.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

/* ================= 藏身处配方 ================= */
let hideoutLoaded = false;
let currentSub = 'crafts';

function switchSubTab(sub) {
  currentSub = sub;
  document.querySelectorAll('.sub-tabs button').forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
  renderHideout();
}

async function loadHideout() {
  if (hideoutLoaded) return;
  const box = document.getElementById('hideout-content');
  try {
    const [crafts, barters, stations] = await Promise.all([
      getJSON('/api/crafts'), getJSON('/api/barters'), getJSON('/api/hideout')
    ]);
    hideoutData = { crafts: crafts.crafts || [], barters: barters.barters || [], stations: stations.stations || [] };
    hideoutLoaded = true;
    renderHideout();
  } catch (e) {
    box.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

let hideoutData = { crafts: [], barters: [], stations: [] };

function renderHideout() {
  const box = document.getElementById('hideout-content');
  if (!hideoutLoaded) return;
  if (currentSub === 'crafts') {
    box.innerHTML = hideoutData.crafts.map(c =>
      '<div class="card"><h3>' + escapeHtml(c.product) + ' ×' + c.product_count + '</h3>' +
      '<div class="kv"><span>工作站 <b>' + escapeHtml(c.station) + ' Lv' + c.level + '</b></span>' +
      '<span>耗时 <b>' + (c.duration ? Math.round(c.duration / 60) + ' 分钟' : '—') + '</b></span></div>' +
      '<div class="req-list">' + c.requirements.map(r => '<span class="req">' + escapeHtml(r.name) + ' ×' + r.count + '</span>').join('') + '</div></div>'
    ).join('');
  } else if (currentSub === 'barters') {
    box.innerHTML = hideoutData.barters.map(b =>
      '<div class="card"><h3>' + escapeHtml(b.offered) + ' ×' + b.offered_count + '</h3>' +
      '<div class="kv"><span>商人 <b>' + escapeHtml(b.trader) + '</b></span>' +
      (b.minTraderLevel != null ? '<span>商人等级 <b>' + b.minTraderLevel + '</b></span>' : '') + '</div>' +
      '<div class="req-list">' + b.requirements.map(r => '<span class="req">' + escapeHtml(r.name) + ' ×' + r.count + '</span>').join('') + '</div></div>'
    ).join('');
  } else {
    box.innerHTML = hideoutData.stations.map(s =>
      '<div class="card"><h3>' + escapeHtml(s.name) + '</h3>' +
      s.levels.map(lv =>
        '<div class="obj"><span class="tag">Lv' + lv.level + '</span>' +
        (lv.requirements.length ? '' : '无材料需求') + '</div>' +
        (lv.requirements.length ? '<div class="req-list">' + lv.requirements.map(r => '<span class="req">' + escapeHtml(r.name) + ' ×' + r.count + '</span>').join('') + '</div>' : '')
      ).join('') + '</div>'
    ).join('');
  }
}

/* ================= 智能助手（聊天） ================= */
const messagesEl = document.getElementById('messages');
const chatInputEl = document.getElementById('chat-input');
const sendBtn = document.getElementById('send');

chatInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function createMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = role === 'user' ? '你' : '助手';
  div.innerHTML = '<div class="label">' + label + '</div><div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function appendTrace(div, steps) {
  if (!steps || steps.length === 0) return;
  const trace = document.createElement('details');
  trace.className = 'trace';
  let html = '<summary>查看思考过程（' + steps.length + ' 步）</summary>';
  steps.forEach((s, i) => {
    if (s.tool) {
      html += '<div class="step"><div class="tool">[' + (i + 1) + '] ' + s.tool + '</div>' +
        '<div class="obs">' + escapeHtml(s.observation) + '</div></div>';
    }
  });
  trace.innerHTML = html;
  div.appendChild(trace);
  scrollBottom();
}

function renderChart(chartData, parentEl) {
  if (!chartData || !chartData.points || chartData.points.length < 2) return;
  const container = document.createElement('div');
  container.className = 'chart-box';
  parentEl.appendChild(container);
  scrollBottom();
  const doRender = () => {
    if (typeof echarts === 'undefined') { setTimeout(doRender, 200); return; }
    const chart = echarts.init(container);
    const labels = chartData.points.map(p => { const d = new Date(p.ts); return (d.getMonth() + 1) + '/' + d.getDate(); });
    const values = chartData.points.map(p => Math.round(p.price));
    chart.setOption({
      backgroundColor: 'transparent',
      grid: { left: 60, right: 16, top: 30, bottom: 28 },
      tooltip: { trigger: 'axis', valueFormatter: v => v + ' 卢布' },
      title: { text: chartData.name + ' 价格趋势（近 ' + chartData.days + ' 天）', left: 'center', textStyle: { color: '#e6e8ec', fontSize: 13, fontWeight: 'normal' } },
      xAxis: { type: 'category', data: labels, axisLabel: { color: '#9aa0aa' }, axisLine: { lineStyle: { color: '#2e3440' } } },
      yAxis: { type: 'value', name: '卢布', nameTextStyle: { color: '#9aa0aa' }, axisLabel: { color: '#9aa0aa', formatter: v => (v >= 10000 ? (v / 10000) + '万' : v) }, splitLine: { lineStyle: { color: '#2e3440' } } },
      series: [{ type: 'line', data: values, smooth: true, showSymbol: false, lineStyle: { color: '#c8a24a', width: 2 }, areaStyle: { color: 'rgba(200,162,74,0.15)' } }]
    });
    window.addEventListener('resize', () => chart.resize());
  };
  doRender();
}

async function sendMessage() {
  const text = chatInputEl.value.trim();
  if (!text) return;
  chatInputEl.value = '';
  createMessage('user', text);
  sendBtn.disabled = true;
  const assistant = createMessage('assistant', '思考中…');
  const bubble = assistant.querySelector('.bubble');
  const steps = [];
  const processLine = (line) => {
    if (!line.startsWith('data: ')) return;
    let data;
    try { data = JSON.parse(line.slice(6)); } catch (e) { return; }
    if (data.type === 'step') { steps.push(data); bubble.textContent = '正在调用 ' + data.tool + '…'; }
    else if (data.type === 'done') { bubble.textContent = data.reply || '（无回复）'; }
    else if (data.type === 'error') { bubble.textContent = '出错了：' + data.content; }
    else if (data.type === 'chart') { renderChart(data.chart, assistant); }
    scrollBottom();
  };
  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      lines.forEach(processLine);
    }
    buffer += decoder.decode();
    buffer.split('\n').forEach(processLine);
    if (!bubble.textContent || bubble.textContent === '思考中…') bubble.textContent = '（无回复）';
    appendTrace(assistant, steps);
  } catch (e) {
    bubble.textContent = '请求失败：' + e.message;
  } finally {
    sendBtn.disabled = false;
    chatInputEl.focus();
    scrollBottom();
  }
}

async function resetChat() {
  try {
    await fetch('/api/reset', { method: 'POST' });
    messagesEl.innerHTML = '';
    createMessage('assistant', '会话已重置，开始新的对话吧！');
  } catch (e) {
    alert('重置失败：' + e.message);
  }
}
